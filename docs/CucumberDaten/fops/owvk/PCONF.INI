..!interpreter english
.. ==================================================
.. owvk/PCONF.INI
.. Version 2.16
.. Logfiles for details are in java/log/in "pconfjfop.log" and "pconfedp.log"
.. initialization of the start parameters for the configurator
.. xcapDlldir and xcapExportdir HAVE TO BE relative from $MANDANDTDIR/win
.. After a change of these variables you have to login again.
.FORMULA T|xcapDlldir    = "Cap_Suite/"
.FORMULA T|xcapDllname   = "StartCAP"
..FORMULA T|xcapExportdir = "Cap_Suite/EXPORT/"   ? T|bspr <> "A"
.FORMULA T|xcapExportdir = "tmp/"                ? T|bspr <> "A"
.FORMULA T|xcapExedir    = "P:\Cap_Suite\"       ? T|bspr <> "A"
..FORMULA T|xcapExportdir = "Cap_Suite_E/EXPORT/" ? T|bspr  = "A"
.FORMULA T|xcapExportdir = "tmp/" ? T|bspr  = "A"
.FORMULA T|xcapExedir    = "P:\Cap_Suite_E\"     ? T|bspr  = "A"
.FORMULA T|xcapExename   = "capuix.exe"
.FORMULA T|xbstartdll    = TRUE
.FORMULA T|xbrunfops     = TRUE
.. ===================================================
.CONTINUE
