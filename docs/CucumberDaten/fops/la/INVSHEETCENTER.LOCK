..!interpreter english translate noabbrev
..*****************************************************************************
.. Name           : INVSHEETCENTER.LOCK
.. Author         : cl
.. Verantwortlich : tiwe
.. Kontrolle      : cl
.. Functionality  : Locks object for IS INVSHEETCENTER and INVENTORYSHEET
..*****************************************************************************
.set trans -
..
.assign M|statusz = ""
.continue END ? P|vorschau
..
.. Lock object
.select object modificationlock waitshort 'M|tzaehlliste^id' ? M|such = "INVSHEETCENTER"
.continue NEXT                                               ? M|such = "INVSHEETCENTER"
..
.select object 'M|tzaehlliste^id'                            ? M|sort = 1 & M|such = "INVENTORYSHEET"
.select object modificationlock waitshort 'M|tzaehlliste^id' ? M|sort <> 1 & M|such = "INVENTORYSHEET"
..
!NEXT
.continue ERROR   ? _G|mehr
.continue NOSPERR ? _G|gesperrt
..*****************************************************************************
!END
.select -
.continue
..*****************************************************************************
!ERROR: Inventory sheet missing!
.copy M|statusz = M|rotz
.end 1
..
!NOSPERR: Lock failed!
.copy M|statusz = M|gelbz
.end 1
