.. alltrotec/TS 17.06.2009
..
.set trans -
..
.. INI-Datei fÅr KostenÅberwÑlzung bei Buchen der Leistungsmeldung
.. 14.06.12 alltrotec/CP: neue Standardbuchung
.. =========================================================================
..
..
.type text xtag xpfad1 xpfad2 xles xkenn xname
.type text x1v1 x1v2 x1v3 x1v4 x1v5 x1v6 x1v7 x1v8 x1v9 x1v10 x1v11 x1v12
.type text x0bef1  x0bef2  x0bef3  x0bef4  x0bef5  x0bef6  x0bef7  x0bef8  x0bef9  x0bef10
.type text x1bef1  x1bef2  x1bef3  x1bef4  x1bef5  x1bef6  x1bef7  x1bef8  x1bef9  x1bef10
.type text x1bef11 x1bef12 x1bef13 x1bef14 x1bef15 x1bef16 x1bef17 x1bef18 x1bef19 x1bef20
.type text x2bef1  x2bef2  x2bef3  x2bef4  x2bef5  x2bef6  x2bef7  x2bef8  x2bef9  x2bef10
.type text x2bef11 x2bef12 x2bef13 x2bef14 x2bef15 x2bef16 x2bef17 x2bef18 x2bef19 x2bef20
.type bool xzei
..
........ Abschnitt A ..........................................................
..
.formula U|xpfad1 = ""
.. Verzeichnis fÅr Sicherung der Datendatei nach Import (in Abschnitt D)
.formula U|xpfad2 = ""
.. am Programmende angelegte Transaktion zeigen ?
.formula U|xzei = G|false
.formula U|xzei = G|TRUE
..
........ Abschnitt B ..........................................................
..
..!meta H|=P152:1
..
.. Variablen zur Erzeugung der Transaktion
.. Indizees lÅckenlos aufsteigend ab 1 !! Variablen-Name: x0bef+ZÑhler
..
.formula U|xtag   = G|datum:8
.formula U|xtag   = U|xtag << -2
.formula U|x0bef1 = "formula H|such       = " + G|dblquote + "LV" + U|xtag + G|dblquote
.formula U|x0bef2 = "formula H|ybezeich   = " + G|dblquote + G|bzeichen    + G|dblquote
.formula U|x0bef3 = "formula H|ytrtypk    = " + G|dblquote + "FF"          + G|dblquote
.formula U|x0bef4 = "formula H|yerfzeit   = " + G|dblquote + "."           + G|dblquote
.formula U|x0bef5 = "formula H|ytrstatusk = " + G|dblquote + "ANG"         + G|dblquote
.formula U|x0bef6 = "formula H|yausloes   = " + G|dblquote + U|xvorg       + G|dblquote
..
..
........ Abschnitt C ..........................................................
..
..!meta H|=P152:2
..
.. Variablen zur Erzeugung des Transaktionsdatensatzes
.. Indizees lÅckenlos aufsteigend ab 1 !! Variablen-Name: x1bef+ZÑhler
..
.. Variablen fÅr Datei - lesen - Befehl (alle Elemente der Datendatei, auch unbenutzte)
..K # name # date # payable cost center # servicetype # Typ # quantity # cost Object # Pos-BuText # project # projecttask # work package #
.formula U|xles    = "file -READ U|XIDAT x1v1 # x1v2 # x1v3 # x1v4 # x1v5 # x1v6 # x1v7 # x1v8 # x1v9 # x1v10 # x1v11 # x1v12"
..
.. Kenner fÅr Wechsel Transaktionsdatensatz (pro Position ein Datensatz)
.formula U|xkenn   = "x1v1"
..
.. Befehle fÅr Zuweisung 
.formula U|x1bef1  = "formula H|such       = " + G|dblquote + "LV" + U|xtag + G|dblquote
.formula U|x1bef2  = "formula H|name       = 'U|x1v2'"
.formula U|x1bef3  = "formula H|ybezeich   = G|bzeichen"
..Statistische ofer Finanzbuchung
.formula U|x1bef4  = "formula H|ybuartk    = 'U|x1v12"
.formula U|x1bef5  = "formula H|ystatusk   = " + G|dblquote + "ANG" + G|dblquote
.formula U|x1bef6  = "formula H|ytext      = 'U|x1v2'"
.formula U|x1bef7  = "formula H|ybudat     = 'U|x1v3'"
.formula U|x1bef8  = "formula H|ykenn      = " + G|dblquote + "ST"  + G|dblquote
.formula U|x1bef9  = "formula H|ykkstelle  = 'U|x1v4'"
.formula U|x1bef10 = "formula H|yleiart    = 'U|x1v5'"
.formula U|x1bef11 = "formula H|yvfv       = 'U|x1v6'"
.formula U|x1bef12 = "formula H|ymge       = 'U|x1v7'"
.formula U|x1bef13 = "formula H|ykstelle   = 'U|x1v8'"
.formula U|x1bef14 = "formula H|yptext     =  U|x1v9"
.formula U|x1bef15 = "formula U|xname      =  U|x1v2"
.formula U|x1bef16 = "formula H|yausloes   = " + G|dblquote + U|xvorg + G|dblquote
.formula U|x1bef17 = "formula H|ytprojekt  =  U|x1v10"
.formula U|x1bef18 = "formula H|ytpvorgang =  U|x1v11"
..
........ Abschnitt D ..........................................................
..
.. Abschnitt fÅr Verarbeitung Datendatei nach Import (z.B. Datensicherung), sonstige Nacharbeiten
.. Indizees lÅckenlos aufsteigend ab 1 !! Variablen-Name: x2bef+ZÑhler
.formula U|x2bef1  = "load 0 object 'U|xvorg'"
.formula U|x2bef2  = "select lock object '0|id'"
.formula U|x2bef3  = "formula H|ytransaktion = 'U|x0transid'"
.formula U|x2bef4  = "rewrite"
.formula U|x2bef5  = "select lock object 'U|x0transid'"
.formula U|x2bef6  = "formula H|name  = 'U|xname'"
.. Protokoll nur in Freitext schreiben, wenn gefÅllt
.formula U|x2bef7  = "formula H|yftext = U|xleer                ?  F|filenotempty(U|xprot)"
.formula U|x2bef8  = "output new 'H|yftext'                     ?  F|filenotempty(U|xprot)"
.formula U|x2bef9  = "input 'U|xprot'                           ?  F|filenotempty(U|xprot)"
.formula U|x2bef10 = "output NEW WERF.WEG                       ?  F|filenotempty(U|xprot)"
.formula U|x2bef11 = "rewrite"
.formula U|x2bef12 = "select -"
.formula U|x2bef13 = "formula U|xsys  = " + G|dblquote + "rm -f " + G|dblquote + " + U|xdat"
.formula U|x2bef14 = "system 'U|xsys' BACKGROUND"
.formula U|x2bef15 = "formula U|xsys  = " + G|dblquote + "rm -f " + G|dblquote + " + U|xprot"
.formula U|x2bef16 = "system 'U|xsys' BACKGROUND"
.formula U|x2bef17 = "formula U|xsys  = " + G|dblquote + "rm -f " + G|dblquote + " + U|xleer"
.formula U|x2bef18 = "system 'U|xsys' BACKGROUND"
..
.continue
