.type text xytaufrufernr                ? _F|defined(U|xytaufrufernr)
.type text xytzeitstempel               ? _F|defined(U|xytzeitstempel)
.type text xttitel                      ? _F|defined(U|xttitel)
.type text xttext1                      ? _F|defined(U|xttext1)
.type text xttext2                      ? _F|defined(U|xttext2)
.type text xtbutton                     ? _F|defined(U|xtbutton)
..
..*****************************************************************************
..
.set trans -
..
..bei Maskeneintritt nur im Ñndern
.continue                       ? _G|evtkommd = G|kaktname13 & G|evtartengl = "SCREEN_ENTER"
..im Zeigen Fehlermeldung
.continue BOX                   ?  G|evtkommd = G|kaktname12 & M|ysperre & _F|empty(M|yaufrufernr)
..im éndern nachfragen
.continue                       ? _G|evtkommd = G|kaktname13
..
..Wenn kein Aufrufer eigetragen, dann auch keine Sperre
.copy M|ysperre = G|FALSE       ?  F|empty(M|yaufrufernr)
..nur prÅfen wenn Sperre gesetzt und nicht edp
.continue                       ? _M|ysperre ; G|EDP
..
..ist gesperrt
.formula U|xytaufrufernr = M|yaufrufernr
.input "allpstart/GET.CALLERNO"
..
.copy M|ysperre = G|FALSE       ? _(U|xytzeitstempel = M|yaufruferzp)
.continue                       ? _M|ysperre
..
!BOX:
.formula U|xtbutton = "yes:no"  ?  G|evtkommd = G|kaktname13
.formula U|xtbutton = "ok"      ?  G|evtkommd = G|kaktname12
..
.set trans +
..
.formula U|xttitel = "Achtung"
.assign  U|xttext1 = F|formatstr("{1} {2} wird gerade bearbeitet.", M|grbez, M|nummer)
.assign  U|xttext2 = F|formatstr("{1} dennoch bearbeiten?", M|grbez)
..
.box -button 'U|xtbutton' -title 'U|xttitel'
'U|xttext1'

Bearbeiter: 'M|ysperrzeich'
Zeitpunkt der Sperre: 'M|ysperrzp'

?'U|xttext2'                    ?  G|evtkommd = G|kaktname13
..
.set trans -
..
.copy M|ysperre = G|FALSE       ?  G|box = G|boxyes & G|evtkommd = G|kaktname13
.continue                       ?  G|box = G|boxyes & G|evtkommd = G|kaktname13
..
.error (0)
.end 1
