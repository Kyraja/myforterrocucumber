..!interpreter english translate noabbrev
..*****************************************************************************
.. Name           : FTEXTEDITOR.HTML.INI
.. Author         : fwester
.. Verantwortlich : fwester
.. Kontrolle      : lei
.. Functionality  : If U|xjava is declared and empty, this will define it.
..
.. In some cases for example due to compatibility requirements you need to
.. define the path to your client Java Runtime Environment different to the
.. default. This program gets you the possibilty to do that.
..
.. Usage: Examples!
.. - means remove this line
.. + means add this line
..
.. You use a non linux client GUI and the latest JRE causes problems. Then you
.. want to use a different version of javaw. Do changes like that:
..
.. - .assign U|xjava = ""
.. ---
.. + .assign U|xjava = "C:\Program Files\Java\jdk1.7.0_45\bin\javaw"
..
..*****************************************************************************
.set trans -
..
..
.continue END    ? _F|defined(U|xjava)
.continue END    ? _F|empty(U|xjava)
.assign U|xjava = ""
.assign U|xlogoname = ""
..*****************************************************************************
!END
.continue
