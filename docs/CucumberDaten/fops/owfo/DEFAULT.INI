!DECLARE:=============== Variablen declarieren ================================
..
.ART bool       xBdefaultini    ? _defined(xBdefaultini)
.ART integer    xbaseframe      ? _defined(T|xbaseframe)
.ART text       xCallerName     ? _defined(T|xCallerName)
.ART bool       xyLader         ? _defined(xyLader)
.ART bool       xyService       ? _defined(xyService)
.ART text       xyKanal         ? _defined(xyKanal)
.ART text       xTmpArb         ? _defined(xTmpArb)
.ART text       xyTmpArb        ? _defined(xyTmpArb)
.ART text       xySeite1        ? _defined(xySeite1)
.ART text       xySeite2        ? _defined(xySeite2)
.ART text       tname           ? _defined(tname)
.ART text       xarb            ? _defined(xarb)
.ART text       xTArb           ? _defined(xTArb)
.ART bool       xyBMitEdi       ? _defined(xyBMitEdi)
.ART integer    xyIAblage       ? _defined(xyIAblage)
.ART integer    xyIerpHauptVers ? _defined(xyIerpHauptVers)
.ART text       xyTerpHauptVers ? _defined(xyTerpHauptVers)
.ART text       xyTerpVers      ? _defined(xyTerpVers)
..
!INIT:================== Variablen initialisieren =============================
..
.FORMEL   T|xbaseframe  = 1
.. Kanalnummer
.FORMEL   T|xyKanal     = T|KANAL
.. tmp-Verzeichnis
.FORMEL   T|xtmparb     = "tmp/"
.FORMEL   T|xyTmpArb    = T|xtmparb
.. Lader aktiv?
.FORMEL   T|xyLader     = T|false
.. Service-Flag
.FORMEL   T|xyService   = T|false
.. Ersetzungszeichen fÿï¿½r Seiten xx von yy - Mu  in printlpr.sh nachbearbeitet werden.
.FORMEL   T|xySeite1    = "###"
.FORMEL   T|xySeite2    = "##"
.FORMEL   T|xyTTrennZeich = "#"
.. Ist EDI eingeschaltet?
.FORMEL   T|xyBMitEdi   = T|false
.. Ablagenprÿï¿½fung (1 = Text; 2 = Bool)     
.FORMEL   T|xyIAblage   = 2
..
..
!MAIN:================== Begin des Programmes =================================
..
.FORMEL   U|xyLader = G|true  ?  (G|PID <> T|xyKanal)
..
..      Service nur au erhalb des Laders
.FORMEL   U|xyService = G|true ? (-bzeich / "*ABAS*") & _T|xyLader & _G|batchmode
..
..############################################################
..****Wordschnittstelle 
.FORMEL T|xTxxworddat = "DATEI18"
..############################################################
..
..
..
.FORMEL U|xyTerpVers      = G|progvers >$ " "
.FORMEL U|xyTerpHauptVers = U|xyTerpVers << 4
.FORMEL U|xyIerpHauptVers = U|xyTerpHauptVers
..
..
..
.. Datei- und Verzeichnisname ermitteln
.FORMEL   T|xbaseframe  = T|baseframe ? defined(T|baseframe)
.FORMEL   T|xCallerName = T|stackframe.xbaseframe
.. Sprachverzeichnis (bspr) ggf. abschneiden
.FORMEL   T|xCallerName = (T|xCallerName >> "/") ? (T|xCallerName / "?\/*")
.WEITER VERZEICH         ? T|xCallerName / "*\/*"
..
.FORMEL   T|tname = T|xCallerName
.FORMEL   T|xarb  = ""
.FORMEL   T|xTArb = T|xarb
.WEITER
..
!VERZEICH: =====Text liegt in einem Unterverzeichnis===========================
..
.FORMEL   T|tname = T|xCallerName >$ "/"
.FORMEL   T|xarb  = T|xCallerName << T|tname
.FORMEL   T|xTArb = T|xarb
.WEITER

